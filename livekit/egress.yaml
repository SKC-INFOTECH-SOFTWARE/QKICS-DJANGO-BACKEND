# livekit/egress.yaml
# ─────────────────────────────────────────────────────────
# REQUIRED CHANGES:
#   1. LIVEKIT_API_KEY_PLACEHOLDER →
#   2. LIVEKIT_API_SECRET_PLACEHOLDER → 
#
# Recording flow:
#   LiveKit Egress → /recordings/<room_id>.mp4 (local Docker volume)
#   egress_ended webhook → Django uploads to Cloudinary → local file delete
# ─────────────────────────────────────────────────────────

api_key:    18ca5e94d6f9d3af05323e9e0aa5a294
api_secret: 99ced558616d7f89507f4a4c5dff0571

ws_url: ws://localhost:7880

redis:
  address: 127.0.0.1:6380

health_port:   7988
template_port: 7980

# false = no seccomp profile (works with cap_add: SYS_ADMIN in docker-compose)
enable_chrome_sandbox: false

# ─── CPU budgeting (2-core VPS) ──────────────────────────────────────────────
# Default room_composite_cpu_cost = 3.0 → egress ek 2-core box par recording
# request ko hi REJECT kar deta hai ("insufficient CPU"). Ise 1.5 par set karne se
# egress maan leta hai ki ek room-composite 2 core par fit ho jaayega.
# Trade-off: ek time par ~1 hi recording safely chalegi; 4-core hone par ise
# hata do (default 3.0 wapas) taaki quality/headroom better rahe.
cpu_cost:
  room_composite_cpu_cost: 1.5

logging:
  level: info
