# livekit/egress.yaml
# ─────────────────────────────────────────────────────────
# REQUIRED CHANGES:
#   1. LIVEKIT_API_KEY_PLACEHOLDER →
#   2. LIVEKIT_API_SECRET_PLACEHOLDER → 
#
# Recording flow:
#   LiveKit Egress → /recordings/<room_id>.mp4 (local Docker volume)
#   egress_ended webhook → Django uploads to Cloudinary → local file delete
# ─────────────────────────────────────────────────────────

api_key:    18ca5e94d6f9d3af05323e9e0aa5a294
api_secret: 99ced558616d7f89507f4a4c5dff0571

ws_url: ws://localhost:7880

redis:
  address: 127.0.0.1:6380

health_port:   7988
template_port: 7980

# false = no seccomp profile (works with cap_add: SYS_ADMIN in docker-compose)
enable_chrome_sandbox: false

# ─── CPU budgeting (4-core server) ───────────────────────────────────────────
# Server ab 4-core hai aur egress ko ~2 core dedicate kiye gaye hain (compose me
# livekit-egress par cpus: '2.0'). room_composite_cpu_cost = 2.0 matlab har
# room-composite recording 2 core reserve karti hai → 4-core par ek time par
# 2 recordings safely chalegi (max 2 rooms wale plan ke saath match). Wapas
# 2-core par jaao to ise 1.5 kar dena aur encode 480p/24fps.
cpu_cost:
  room_composite_cpu_cost: 2.0

logging:
  level: info
